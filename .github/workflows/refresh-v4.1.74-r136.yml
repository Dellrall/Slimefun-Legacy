name: Publish v4.1.74 addon-only r136

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-v4.1.74-r136.yml'
      - 'scripts/publish_r136.py'
      - 'scripts/test_publish_r136.py'
      - 'docs/addon-bundle-r136.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-v4.1.74-r136.yml'
      - 'scripts/publish_r136.py'
      - 'scripts/test_publish_r136.py'
      - 'docs/addon-bundle-r136.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: addon-only-release-v4.1.74
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify official JARs and preserve 43 unchanged addons
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test publication leases and existing archive preservation
        run: |
          PYTHONPATH=scripts python3 -m unittest scripts/test_publish_r136.py scripts/test_refresh_release_addon.py scripts/test_verify_published_addon_bundle.py scripts/test_verify_addon_bytecode.py
      - name: Build two deterministic archives from the released r135 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_r136.py prepare
      - name: Preserve verified candidate and original rollback archive
        uses: actions/upload-artifact@v7
        with:
          name: r136-publication
          path: |
            work/r136/SF_Addons_1.21.11-26.3.zip
            work/r136/original/SF_Addons_1.21.11-26.3.zip
            work/r136/validation.json
            work/r136/release-before.json
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish approved addon ZIP only
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'Publish addon bundle r136')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: r136-publication
          path: work/r136
      - name: Recheck release lease, promote verified ZIP and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_r136.py publish
      - name: Retain public release verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r136-publication-result
          path: |
            work/r136/validation.json
            work/r136/release-after.json
          retention-days: 30
          if-no-files-found: warn
