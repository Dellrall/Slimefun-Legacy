name: Prepare 4.1.75 metadata for review

on:
  push:
    branches: ['workbench/release-4.1.75-metadata-20261015']
    paths: ['.github/workflows/workbench-release-4.1.75.yml']

# Execute the already-reviewed preparation recipe by immutable blob identity.
# Only the candidate README sentence is corrected after the first verifier run.
# Creates unreferenced Git objects only; no refs, tags, releases or PRs are moved.
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed production base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 88e0b1e416c473485b2912dfe8413780d625a169
          persist-credentials: false
      - name: Set up the existing Java toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute the pinned preparation recipe with corrected README wording
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          blob = '8c71ae851a24ea943757e8a3790ecf83bc6733dd'
          req = urllib.request.Request(
              'https://api.github.com/repos/wickidcow/Slimefun-Legacy/git/blobs/' + blob,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'User-Agent': 'SFL-Explicit-Release-Preparation'})
          with urllib.request.urlopen(req, timeout=45) as response:
              value = json.load(response)
          assert value['encoding'] == 'base64'
          raw = base64.b64decode(value['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == blob
          recipe = raw.decode('utf-8')
          old = "'Slimefun Legacy **4.1.75 candidate** targets **Paper 26.3 / Minecraft 26.3 on Java 25**, '"
          new = "'Slimefun Legacy 4.1.75 is tested primarily against **Paper 26.3 / Minecraft 26.3 on Java 25** by candidate-validation workflows, '"
          assert recipe.count(old) == 1
          recipe = recipe.replace(old, new, 1)

          def script(name):
              marker = '      - name: ' + name + '\n'
              assert recipe.count(marker) == 1, name
              section = recipe.split(marker, 1)[1].split('\n      - name: ', 1)[0]
              body = section.split('        run: |\n', 1)[1]
              result = []
              for line in body.splitlines():
                  assert not line.strip() or line.startswith('          '), repr(line)
                  result.append(line[10:] if line.startswith('          ') else '')
              return '\n'.join(result) + '\n'

          # The pinned recipe contains exact source/base checks and the eight-file
          # allowlist. Its Git API stage never calls any refs or release endpoint.
          for name in (
              'Prepare bounded metadata and release notes',
              'Run the existing complete source-invariant suite',
              'Create unreferenced candidate objects for explicit review',
          ):
              print('Executing reviewed step:', name, flush=True)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', script(name)], check=True)
          Path('release-preparation-evidence/recipe.json').write_text(json.dumps({
              'original_recipe_blob': blob,
              'effective_recipe_sha256': hashlib.sha256(recipe.encode()).hexdigest(),
              'correction': 'README current-version sentence preserves the existing verifier wording',
              'source_verifiers_changed': False,
              'refs_moved': False,
          }, indent=2) + '\n')
          PY
      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-4.1.75-preparation
          path: release-preparation-evidence/
          if-no-files-found: error
          retention-days: 14
