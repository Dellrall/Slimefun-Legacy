name: Folia 26.3 Addon Admission Audit

on:
  pull_request:
    paths:
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'scripts/audit_folia_addon_admission.py'
      - 'scripts/test_audit_folia_addon_admission.py'
      - '.github/workflows/folia-26.3-addon-admission.yml'
      - 'docs/compatibility/FOLIA_26_3_ADDONS.md'
  push:
    branches: [master]
    paths:
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'scripts/audit_folia_addon_admission.py'
      - 'scripts/test_audit_folia_addon_admission.py'
      - '.github/workflows/folia-26.3-addon-admission.yml'
      - 'docs/compatibility/FOLIA_26_3_ADDONS.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: folia-26-3-addon-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit exact 45-addon Folia admission metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Test audit parser offline
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_audit_folia_addon_admission.py -v

      - name: Wait for exact-head canonical addon bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          RUN_ID=''
          for attempt in $(seq 1 180); do
            MATCH="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow build-sfl-addons-compat-bundle.yml               --limit 80               --json databaseId,headSha,status,conclusion               | jq --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | reverse | .[0] // {}')"
            MATCH_ID="$(jq -r '.databaseId // empty' <<<"$MATCH")"
            MATCH_STATUS="$(jq -r '.status // empty' <<<"$MATCH")"
            MATCH_CONCLUSION="$(jq -r '.conclusion // empty' <<<"$MATCH")"

            if [[ -n "$MATCH_ID" && "$MATCH_STATUS" == "completed" && "$MATCH_CONCLUSION" == "success" ]]; then
              RUN_ID="$MATCH_ID"
              break
            fi
            if [[ -n "$MATCH_ID" && "$MATCH_STATUS" == "completed" && "$MATCH_CONCLUSION" != "success" ]]; then
              echo "Exact-head addon bundle run $MATCH_ID completed with $MATCH_CONCLUSION." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 180 ]]; then
              echo "No successful exact-head canonical addon bundle became available for $TARGET_SHA." >&2
              exit 1
            fi
            echo "Waiting for exact-head addon bundle (attempt $attempt/180; run=${MATCH_ID:-not-started}; status=${MATCH_STATUS:-unknown})"
            sleep 10
          done

          mkdir -p build/bundle
          gh run download "$RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name SF_Addons_1.21.11-26.3             --dir build/bundle
          test -s build/bundle/SF_Addons_1.21.11-26.3.zip
          echo "BUNDLE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Audit descriptor-level Folia admission
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_folia_addon_admission.py             build/bundle/SF_Addons_1.21.11-26.3.zip             --expect-addons 45             --output build/folia-26.3-addon-admission.json

      - name: Publish admission summary
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report=json.loads(Path('build/folia-26.3-addon-admission.json').read_text())
          counts=report['counts']
          print('## Folia 26.3 addon admission audit')
          print()
          print(f"- Bundle revision: {report['bundle_revision']}")
          print(f"- Exact addon count: {report['addon_count']}")
          print(f"- Declared `folia-supported: true`: **{counts['declared_true']}**")
          print(f"- Declared `folia-supported: false`: **{counts['declared_false']}**")
          print(f"- Undeclared: **{counts['undeclared']}**")
          print()
          print('This is descriptor admission metadata only, not runtime/gameplay certification.')
          print()
          print('### Declared true')
          for row in report['addons']:
              if row['admission']=='declared-true':
                  print(f"- `{row['repository']}` — `{row['jar']}`")
          print()
          print('### Undeclared')
          for row in report['addons']:
              if row['admission']=='undeclared':
                  print(f"- `{row['repository']}` — `{row['jar']}`")
          PY

      - name: Upload admission evidence
        uses: actions/upload-artifact@v7
        with:
          name: folia-26.3-addon-admission
          path: build/folia-26.3-addon-admission.json
          if-no-files-found: error
