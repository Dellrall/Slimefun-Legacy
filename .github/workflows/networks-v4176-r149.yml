name: Safely update v4.1.76 Networks addon to 1.0.61 (r149)

on:
  pull_request:
    paths:
      - '.github/workflows/networks-v4176-r149.yml'
      - 'scripts/prepare_networks_r149_release_asset.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/networks-v4176-r149.yml'
      - 'scripts/prepare_networks_r149_release_asset.py'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only after all exact-source r149 release checks pass'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: v4176-r149-networks-only-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify all 45 addons and guard optional publication
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Run exact-source native rejection contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_native_storage_probe_contracts.py' -v
          python3 -m unittest discover -s scripts -p 'test_black_market_probe_contracts.py' -v

      - name: Download the exact released Networks JAR and current r148 addon ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          test "$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq .tag_name)" = 'v4.1.76'
          test "$(gh api repos/wickidcow/SF_NetworksExp/releases/latest --jq .tag_name)" = 'v1.0.61'
          gh release download v4.1.76 --repo wickidcow/Slimefun-Legacy \
            --pattern 'SF_Addons_1.21.11-26.3.zip' --dir inputs
          gh release download v1.0.61 --repo wickidcow/SF_NetworksExp \
            --pattern 'SF_Networks1.0.61.jar' --dir inputs
          echo '31ccb589a4e590b2308a57843d65a6418f4f5cb8b50769a330a8edab443e6b2b  inputs/SF_Addons_1.21.11-26.3.zip' | sha256sum -c
          echo '760d8941ee3e332342a06939d78fad0af4fff072bd16157eae8d0ce46366db2b  inputs/SF_Networks1.0.61.jar' | sha256sum -c

      - name: Replace only Networks and verify preserved bytes and manifest
        run: |
          set -euo pipefail
          python3 scripts/prepare_networks_r149_release_asset.py \
            --old inputs/SF_Addons_1.21.11-26.3.zip \
            --networks inputs/SF_Networks1.0.61.jar \
            --matrix compatibility/sfl-addon-release-matrix.json \
            --output dist/SF_Addons_1.21.11-26.3.zip \
            --receipt dist/networks-r149-preservation.json \
            --old-sha256 31ccb589a4e590b2308a57843d65a6418f4f5cb8b50769a330a8edab443e6b2b \
            --networks-sha256 760d8941ee3e332342a06939d78fad0af4fff072bd16157eae8d0ce46366db2b
          test -s dist/SF_Addons_1.21.11-26.3.zip
          python3 -m zipfile -t dist/SF_Addons_1.21.11-26.3.zip

      - name: Retain complete dry-run release candidate (never publish on PR)
        uses: actions/upload-artifact@v7
        with:
          name: SF_Addons_v4.1.76_Networks_1.0.61_r149_preview
          path: dist/SF_Addons_1.21.11-26.3.zip
          archive: false
          if-no-files-found: error

      - name: Retain signed-input and conservation receipts
        uses: actions/upload-artifact@v7
        with:
          name: networks-r149-preservation-report
          path: dist/networks-r149-preservation.json
          if-no-files-found: error

      - name: Require exact merged-source canonical and full-stack CI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=wickidcow/Slimefun-Legacy
          test "$GITHUB_REF" = refs/heads/master
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = v4.1.76
          python3 - <<'PY'
          import json
          with open('compatibility/sfl-addon-release-matrix.json', encoding='utf-8') as f:
              source = json.load(f)
          rows = {row['repository']: row['source_commit'] for row in source['addons']}
          assert type(source['bundle_revision']) is int and source['bundle_revision'] == 149
          assert len(rows) == 45
          assert rows['wickidcow/SF_NetworksExp'] == '9bf9f48b49dbedbf9e617ca840d9ccd57cf0c717'
          assert rows['wickidcow/SF_SlimeHUD'] == '72ba3ca673beb2b48c15b5dc77bf1d1880f8a1e3'
          assert rows['wickidcow/SF_MagicExpansion'] == 'e0097f1d8e984e8d19692fcc5a28729366b72d48'
          PY
          require_exact_run() {
            local workflow="$1"
            local accepted_event="$2"
            local state=''
            for attempt in $(seq 1 120); do
              runs="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=30")"
              state="$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" --arg ev "$accepted_event" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == $ev)] | sort_by(.created_at) | last | .conclusion // ""')"
              if [[ "$state" == success ]]; then
                echo "Verified exact-source $workflow success for $GITHUB_SHA"
                break
              fi
              if [[ "$state" == failure || "$state" == cancelled || "$state" == timed_out ]]; then
                echo "Required $workflow ended $state; publication refused" >&2
                exit 1
              fi
              if [[ "$attempt" == 120 ]]; then
                echo "No successful exact-source $workflow after 60 minutes; publication refused" >&2
                exit 1
              fi
              sleep 30
            done
          }
          require_exact_run 'build-sfl-addons-compat-bundle.yml' push
          # Full-stack follower is tied to the successful canonical bundle run.
          require_exact_run 'paper-26.3-full-stack.yml' workflow_run
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA"

      - name: Publish atomically only with checksum-pinned rollback
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          REPO=wickidcow/Slimefun-Legacy
          TAG=v4.1.76
          NAME=SF_Addons_1.21.11-26.3.zip
          EXPECTED_OLD='sha256:31ccb589a4e590b2308a57843d65a6418f4f5cb8b50769a330a8edab443e6b2b'
          NEW_SHA="$(sha256sum "dist/$NAME" | awk '{print $1}')"
          test "$GITHUB_REF" = refs/heads/master
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          old_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .id')"
          old_digest="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .digest')"
          test -n "$old_id"
          test "$old_digest" = "$EXPECTED_OLD"
          BACKUP=SF_Addons_1.21.11-26.3.before-Networks-1.0.61.zip
          test -z "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.before-Networks-1.0.61.zip") | .id')"
          gh api --method PATCH "repos/$REPO/releases/assets/$old_id" -f name="$BACKUP" >/dev/null
          rollback() {
            echo 'r149 upload failed; restoring the original r148 release ZIP' >&2
            new_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .id' || true)"
            if [[ -n "$new_id" ]]; then gh api --method DELETE "repos/$REPO/releases/assets/$new_id" >/dev/null || true; fi
            gh api --method PATCH "repos/$REPO/releases/assets/$old_id" -f name="$NAME" >/dev/null || true
          }
          trap rollback ERR
          gh release upload "$TAG" "dist/$NAME" --repo "$REPO"
          uploaded_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .id')"
          uploaded_sha="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .digest')"
          test -n "$uploaded_id"
          test "$uploaded_sha" = "sha256:$NEW_SHA"
          mkdir -p verified-upload
          gh release download "$TAG" --repo "$REPO" --pattern "$NAME" --dir verified-upload
          echo "$NEW_SHA  verified-upload/$NAME" | sha256sum -c
          gh api --method DELETE "repos/$REPO/releases/assets/$old_id" >/dev/null
          trap - ERR
          echo "Networks 1.0.61 r149 published; SHA-256 $NEW_SHA" >> "$GITHUB_STEP_SUMMARY"
