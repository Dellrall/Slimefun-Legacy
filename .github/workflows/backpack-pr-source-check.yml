name: PR 391 Pristine Source Check
on:
  push:
    branches: [diagnostic/backpack-transaction-workbench-20261015]
    paths: [.github/workflows/backpack-pr-source-check.yml]
permissions:
  contents: read
jobs:
  pristine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a955f08fee5c34914060b1426f64e0013e1ef66f
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Record the exact committed Java inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a955f08fee5c34914060b1426f64e0013e1ef66f
          mkdir -p source-evidence
          git diff --name-only b5db114abe5703a8fb80466724c74e1796feab5a HEAD -- '*.java' > source-evidence/changed-java.txt
          test "$(wc -l < source-evidence/changed-java.txt)" = 17
          xargs -d '\n' sha256sum < source-evidence/changed-java.txt > source-evidence/java.sha256
          cat > "$RUNNER_TEMP/backpack-pristine.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              def project = gradle.rootProject
              def paths = project.file('source-evidence/changed-java.txt').readLines()
              project.extensions.getByName('spotless').java { target(paths) }
          }
          GRADLE
          cp "$RUNNER_TEMP/backpack-pristine.init.gradle" source-evidence/
      - name: Check only; never run spotlessApply
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew -I "$RUNNER_TEMP/backpack-pristine.init.gradle" spotlessCheck --no-daemon --no-build-cache --no-configuration-cache --console=plain 2>&1 | tee source-evidence/formatting.log
          sha256sum --check --strict source-evidence/java.sha256
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check b5db114abe5703a8fb80466724c74e1796feab5a HEAD
          python3 scripts/verify_container_storage_correctness.py . | tee source-evidence/atomic-guard.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue390-pr391-pristine-source
          path: source-evidence/
          retention-days: 14
          if-no-files-found: error
