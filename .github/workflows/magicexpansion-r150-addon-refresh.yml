name: Safely refresh the latest Slimefun addon ZIP with MagicExpansion 1.1.18 (r150)

on:
  pull_request:
    paths:
      - '.github/workflows/magicexpansion-r150-addon-refresh.yml'
      - 'scripts/prepare_magic_r150_release_asset.py'
      - 'scripts/test_prepare_magic_r150_release_asset.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/magicexpansion-r150-addon-refresh.yml'
      - 'scripts/prepare_magic_r150_release_asset.py'
      - 'scripts/test_prepare_magic_r150_release_asset.py'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only after all exact-source r150 release checks pass'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: magicexpansion-r150-release-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify all 45 addons and guard optional publication
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Run exact-source native rejection contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_native_storage_probe_contracts.py' -v
          python3 -m unittest discover -s scripts -p 'test_black_market_probe_contracts.py' -v
          python3 -m unittest discover -s scripts -p 'test_prepare_magic_r150_release_asset.py' -v

      - name: Validate and download the latest published r149 bundle
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=wickidcow/Slimefun-Legacy
          TAG="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          [[ "$TAG" == v4.1.76 || "$TAG" == v4.1.77 ]] || exit 1
          META="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | [.id,.digest] | @tsv')"
          test "$(printf '%s\n' "$META" | wc -l)" -eq 1
          ID="$(printf '%s' "$META" | cut -f1)"
          SHA="$(printf '%s' "$META" | cut -f2)"
          [[ "$ID" =~ ^[0-9]+$ && "$SHA" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$TAG" == v4.1.76 ]]; then
            test "$SHA" = 'sha256:08e520b68a40896c09773f8b831c47130a05cb1b01e1f1ab573ca58064ad445e'
          fi
          mkdir -p inputs
          gh release download "$TAG" --repo "$REPO" --pattern 'SF_Addons_1.21.11-26.3.zip' --dir inputs
          OLD_SHA="$(printf %s "$SHA" | cut -c8-)"
          echo "$OLD_SHA  inputs/SF_Addons_1.21.11-26.3.zip" | sha256sum -c -
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "old_id=$ID" >> "$GITHUB_OUTPUT"
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact merged MagicExpansion 1.1.18 source
        uses: actions/checkout@v6
        with:
          repository: wickidcow/SF_MagicExpansion
          ref: 7c2c1a927176ebd0aaab4481dcc21a51320f7f10
          path: magic-source
          persist-credentials: false
      - name: Set up Java 25 for MagicExpansion
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build verified MagicExpansion 1.1.18 JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C magic-source rev-parse HEAD)" = 7c2c1a927176ebd0aaab4481dcc21a51320f7f10
          (cd magic-source && bash scripts/install_slimefun_api.sh && mvn --batch-mode --no-transfer-progress clean verify)
          test -s magic-source/target/SF_MagicExpansion1.1.18.jar
          python3 - <<'PY'
          import re,zipfile
          with zipfile.ZipFile('magic-source/target/SF_MagicExpansion1.1.18.jar') as jar:
              assert jar.testzip() is None
              txt = jar.read('plugin.yml').decode()
              assert re.search(r'(?m)^name:\s*magicexpansion\s*$', txt)
              assert re.search(r'(?m)^version:\s*1\.1\.18\s*$', txt)
              for name in ('ResourceMachine','ResourceRandomOneMachine'):
                  assert any(x.endswith('/'+name+'.class') for x in jar.namelist())
          PY
      - name: Replace only MagicExpansion, preserving other 44 addon JARs
        run: |
          set -euo pipefail
          JAR=magic-source/target/SF_MagicExpansion1.1.18.jar
          python3 scripts/prepare_magic_r150_release_asset.py \
            --old inputs/SF_Addons_1.21.11-26.3.zip \
            --magic "$JAR" \
            --matrix compatibility/sfl-addon-release-matrix.json \
            --output dist/SF_Addons_1.21.11-26.3.zip \
            --receipt dist/magicexpansion-r150-preservation.json \
            --old-sha256 '${{ steps.base.outputs.old_sha }}' \
            --magic-sha256 "$(sha256sum "$JAR" | awk '{print $1}')"
          python3 -m zipfile -t dist/SF_Addons_1.21.11-26.3.zip

      - name: Retain complete dry-run release candidate (never publish on PR)
        uses: actions/upload-artifact@v7
        with:
          name: SF_Addons_MagicExpansion_1.1.18_r150_preview
          path: dist/SF_Addons_1.21.11-26.3.zip
          archive: false
          if-no-files-found: error

      - name: Retain signed-input and conservation receipts
        uses: actions/upload-artifact@v7
        with:
          name: magicexpansion-r150-preservation-report
          path: dist/magicexpansion-r150-preservation.json
          if-no-files-found: error

      - name: Require exact merged-source canonical and full-stack CI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=wickidcow/Slimefun-Legacy
          test "$GITHUB_REF" = refs/heads/master
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = '${{ steps.base.outputs.tag }}'
          python3 - <<'PY'
          import json
          with open('compatibility/sfl-addon-release-matrix.json', encoding='utf-8') as f:
              source = json.load(f)
          rows = {row['repository']: row['source_commit'] for row in source['addons']}
          assert type(source['bundle_revision']) is int and source['bundle_revision'] == 150
          assert len(rows) == 45
          assert rows['wickidcow/SF_NetworksExp'] == '9bf9f48b49dbedbf9e617ca840d9ccd57cf0c717'
          assert rows['wickidcow/SF_SlimeHUD'] == '72ba3ca673beb2b48c15b5dc77bf1d1880f8a1e3'
          assert rows['wickidcow/SF_MagicExpansion'] == '7c2c1a927176ebd0aaab4481dcc21a51320f7f10'
          PY
          require_exact_run() {
            local workflow="$1"
            local accepted_event="$2"
            local state=''
            for attempt in $(seq 1 120); do
              runs="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=30")"
              state="$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" --arg ev "$accepted_event" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == $ev)] | sort_by(.created_at) | last | .conclusion // ""')"
              if [[ "$state" == success ]]; then
                echo "Verified exact-source $workflow success for $GITHUB_SHA"
                break
              fi
              if [[ "$state" == failure || "$state" == cancelled || "$state" == timed_out ]]; then
                echo "Required $workflow ended $state; publication refused" >&2
                exit 1
              fi
              if [[ "$attempt" == 120 ]]; then
                echo "No successful exact-source $workflow after 60 minutes; publication refused" >&2
                exit 1
              fi
              sleep 30
            done
          }
          require_exact_run 'build-sfl-addons-compat-bundle.yml' push
          # Full-stack follower is tied to the successful canonical bundle run.
          require_exact_run 'paper-26.3-full-stack.yml' workflow_run
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA"

      - name: Publish r150 with rollback after all exact-source gates
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          REPO=wickidcow/Slimefun-Legacy
          TAG='${{ steps.base.outputs.tag }}'
          OLD_ID='${{ steps.base.outputs.old_id }}'
          OLD_SHA='${{ steps.base.outputs.old_sha }}'
          NAME=SF_Addons_1.21.11-26.3.zip
          BACKUP=SF_Addons_1.21.11-26.3.before-MagicExpansion-1.1.18.zip
          NEW_SHA="$(sha256sum "dist/$NAME" | awk '{print $1}')"
          test "$GITHUB_REF" = refs/heads/master
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          current="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | [.id,.digest] | @tsv')"
          test "$current" = "$(printf '%s\t%s' "$OLD_ID" "sha256:$OLD_SHA")"
          test -z "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.before-MagicExpansion-1.1.18.zip") | .id')"
          gh api --method PATCH "repos/$REPO/releases/assets/$OLD_ID" -f name="$BACKUP" >/dev/null
          rollback() {
            echo 'r150 upload failed; restore original r149 ZIP' >&2
            found="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .id' || true)"
            if [[ -n "$found" ]]; then gh api --method DELETE "repos/$REPO/releases/assets/$found" >/dev/null || true; fi
            gh api --method PATCH "repos/$REPO/releases/assets/$OLD_ID" -f name="$NAME" >/dev/null || true
          }
          trap rollback ERR
          gh release upload "$TAG" "dist/$NAME" --repo "$REPO"
          digest="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .digest')"
          test "$digest" = "sha256:$NEW_SHA"
          mkdir -p verified
          gh release download "$TAG" --repo "$REPO" --pattern "$NAME" --dir verified
          echo "$NEW_SHA  verified/$NAME" | sha256sum -c -
          gh api --method DELETE "repos/$REPO/releases/assets/$OLD_ID" >/dev/null
          trap - ERR
          echo "MagicExpansion 1.1.18 r150 published to $TAG; SHA256 $NEW_SHA" >> "$GITHUB_STEP_SUMMARY"
