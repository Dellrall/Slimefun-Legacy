name: Gradle Spotless Deprecation Regression

on:
  pull_request:
    paths:
      - '.github/workflows/gradle-spotless-deprecation.yml'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
  push:
    branches: [master]
    paths:
      - '.github/workflows/gradle-spotless-deprecation.yml'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spotless-deprecation:
    name: Check formatter and Gradle Configuration.visible warnings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify Spotless and reject removed Gradle API
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessCheck --warning-mode all --console=plain --no-daemon 2>&1 | tee spotless-deprecation.log
          if grep -Fq 'Configuration.setVisible(boolean) method has been deprecated' spotless-deprecation.log; then
            echo 'Spotless/Gradle configuration still calls the deprecated Configuration.setVisible API.' >&2
            exit 1
          fi
          echo 'Spotless formatting passed without the Configuration.setVisible deprecation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact-head diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotless-deprecation-log
          path: spotless-deprecation.log
          if-no-files-found: warn
