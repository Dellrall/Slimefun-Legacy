name: Refresh v4.1.73 addon bundle with Networks 1.0.51

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-v4.1.73-networks-1.0.51.yml'
      - 'compatibility/bundle-refresh-r131.json'
      - 'scripts/refresh_release_addon.py'
      - 'scripts/test_refresh_release_addon.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-v4.1.73-networks-1.0.51.yml'
      - 'compatibility/bundle-refresh-r131.json'
      - 'scripts/refresh_release_addon.py'
      - 'scripts/test_refresh_release_addon.py'

permissions:
  contents: read

concurrency:
  group: refresh-v4.1.73-addon-bundle
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'Publish addon bundle r131 with Networks 1.0.51')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.refresh.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify refresh and archive guards
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_refresh_release_addon.py scripts/test_verify_published_addon_bundle.py scripts/test_verify_addon_bytecode.py
      - name: Download pinned release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/current work/new
          gh release download v4.1.73 --repo "$GITHUB_REPOSITORY" \
            --pattern SF_Addons_1.21.11-26.3.zip --pattern Slimefun-Legacy4.1.73.jar --dir work/current
          gh release download v1.0.51 --repo wickidcow/SF_NetworksExp \
            --pattern SF_Networks1.0.51.jar --dir work/new
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          config = json.loads(Path('compatibility/bundle-refresh-r131.json').read_text())
          core = Path('work/current') / config['core_jar']
          assert hashlib.sha256(core.read_bytes()).hexdigest() == config['core_sha256'], 'Published core changed'
          PY
      - name: Create and validate the targeted refresh
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_release_addon.py \
            --config compatibility/bundle-refresh-r131.json \
            --matrix compatibility/sfl-addon-release-matrix.json \
            --original work/current/SF_Addons_1.21.11-26.3.zip \
            --addon work/new/SF_Networks1.0.51.jar \
            --output work/SF_Addons_1.21.11-26.3.zip | tee work/validation.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('work/validation.json').read_text())
          config = json.loads(Path('compatibility/bundle-refresh-r131.json').read_text())
          assert report['bundle_sha256'] == config['candidate_bundle_sha256'], 'Candidate differs from reviewed ZIP'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + report['bundle_sha256'] + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: addon-bundle-r131-candidate
          path: |
            work/SF_Addons_1.21.11-26.3.zip
            work/validation.json
          if-no-files-found: error

  publish:
    needs: prepare
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish addon bundle r131 with Networks 1.0.51')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: addon-bundle-r131-candidate
          path: work
      - name: Recheck live release and replace the addon ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > work/latest.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.1.73" > work/release.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          config = json.loads(Path('compatibility/bundle-refresh-r131.json').read_text())
          current = json.loads(Path('work/release.json').read_text())
          latest = json.loads(Path('work/latest.json').read_text())
          assert latest['tag_name'] == config['release_tag'], 'Latest core release advanced; refresh must be rebased'
          assert current['target_commitish'] == config['core_source_commit'], 'Release target changed'
          assets = {asset['name']: asset for asset in current['assets']}
          assert assets[config['core_jar']]['digest'] == 'sha256:' + config['core_sha256'], 'Release core changed'
          assert assets[config['resource_pack']]['digest'] == 'sha256:' + config['resource_pack_sha256'], 'Resource pack changed'
          assert assets[config['bundle_name']]['digest'] == 'sha256:' + config['old_bundle_sha256'], 'Live bundle changed; refusing to overwrite another update'
          digest = hashlib.sha256((Path('work') / config['bundle_name']).read_bytes()).hexdigest()
          assert digest == os.environ['CANDIDATE_DIGEST'], 'Candidate artifact changed'
          PY
          gh release upload v4.1.73 work/SF_Addons_1.21.11-26.3.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.1.73" > work/published.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('compatibility/bundle-refresh-r131.json').read_text())
          published = json.loads(Path('work/published.json').read_text())
          assets = {asset['name']: asset for asset in published['assets']}
          assert assets[config['bundle_name']]['digest'] == 'sha256:' + os.environ['CANDIDATE_DIGEST']
          assert assets[config['core_jar']]['digest'] == 'sha256:' + config['core_sha256']
          assert assets[config['resource_pack']]['digest'] == 'sha256:' + config['resource_pack_sha256']
          body = published.get('body') or ''
          body = body.replace(
              'The release assets are available only after successful gated publication at\n'
              '[GitHub Releases](https://github.com/wickidcow/Slimefun-Legacy/releases).\n'
              'Until then, this file describes the **4.1.73 candidate**, not an installed fix\n'
              'or a published downloadable JAR.',
              'Slimefun Legacy **4.1.73** is published. The addon ZIP is now at **revision 131**,\n'
              'including **Networks 1.0.51**. See the targeted refresh details below;\n'
              'the original revision-130 release notes are retained as historical context.')
          marker = '## Addon bundle refresh — revision 131'
          note = Path('docs/addon-bundle-r131.md').read_text()
          assert marker in note
          if marker not in body:
              body = body.rstrip() + '\n\n' + note
          Path('work/release-notes.md').write_text(body)
          print('Published revision 131; core and other addon JARs remain unchanged.')
          PY
          gh release edit v4.1.73 --repo "$GITHUB_REPOSITORY" --notes-file work/release-notes.md
