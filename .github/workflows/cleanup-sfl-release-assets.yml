name: Clean Slimefun Legacy release assets

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-sfl-release-assets.yml'
      - 'scripts/verify_sfl_release_assets.py'
      - 'scripts/test_verify_sfl_release_assets.py'
  pull_request:
    paths:
      - '.github/workflows/cleanup-sfl-release-assets.yml'
      - 'scripts/verify_sfl_release_assets.py'
      - 'scripts/test_verify_sfl_release_assets.py'
  workflow_run:
    workflows: ['Build SF Addons 1.21.11-26.3 Bundle']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-slimefun-legacy-release-assets-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  policy-tests:
    name: Verify release preservation policy offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/test_verify_sfl_release_assets.py

  clean:
    name: Keep Slimefun Legacy release core-focused
    needs: policy-tests
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Normalize latest stable Slimefun Legacy release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > release-before.json
          python3 scripts/verify_sfl_release_assets.py plan release-before.json \
            --delete-ids delete-ids.txt > release-plan.json
          RELEASE_ID="$(python3 -c 'import json; print(json.load(open("release-plan.json"))["release_id"])')"
          while IFS= read -r asset_id; do
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            echo "Removing preflighted obsolete asset ID ${asset_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done < delete-ids.txt
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-after.json
          python3 scripts/verify_sfl_release_assets.py verify release-before.json \
            --after release-after.json > release-verified.json

      - name: Publish summary
        shell: bash
        run: |
          {
            echo '## Slimefun Legacy release cleanup'
            echo
            echo '- Exact tag-matching core JAR and canonical addon bundle are required.'
            echo '- The optional resource pack and explicitly pinned r136 rollback are preserved.'
            echo '- Unknown assets fail preflight before deletion; no blanket four-asset exception.'
            echo '- Retained IDs, sizes and API digests must match before and after cleanup.'
            echo '- Only the established obsolete-asset families may be removed.'
            echo '- Individual addon releases remain the responsibility of their own repositories.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve cleanup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-preservation-evidence
          path: |
            release-before.json
            release-plan.json
            delete-ids.txt
            release-after.json
            release-verified.json
          if-no-files-found: warn
          retention-days: 14
