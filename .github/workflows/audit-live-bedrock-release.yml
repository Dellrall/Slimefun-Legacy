name: Audit live Geyser Bedrock release bytes

on:
  pull_request:
    paths:
      - '.github/workflows/audit-live-bedrock-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned complete source and verifier
        uses: actions/checkout@v6
      - name: Verify exact GitHub release identity and fetch the LIVE published ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/bedrock-asset-audit
          gh api repos/wickidcow/Slimefun-Legacy/releases/tags/v4.1.76 > build/bedrock-asset-audit/release.json
          test "$(jq -r .tag_name build/bedrock-asset-audit/release.json)" = v4.1.76
          jq -e '.assets[] | select(.name=="SlimefunLegacyRP_GEYSER-BEDROCK.zip" and .digest=="sha256:2f880ca6100837657fbc05daf3b383f2c3a5e5c0db58339087885b7ebebbf88e" and .size==1338619 and .state=="uploaded")' build/bedrock-asset-audit/release.json
          gh release download v4.1.76 --repo wickidcow/Slimefun-Legacy \
            --pattern 'SlimefunLegacyRP_GEYSER-BEDROCK.zip' \
            --dir build/bedrock-asset-audit
          echo '2f880ca6100837657fbc05daf3b383f2c3a5e5c0db58339087885b7ebebbf88e  build/bedrock-asset-audit/SlimefunLegacyRP_GEYSER-BEDROCK.zip' | sha256sum --check

      - name: Compare every ZIP member and run existing strict Geyser pack checker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import copy
          import hashlib
          import json
          import stat
          import sys
          import zipfile
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import verify_release_bedrock_pack as validator
          work = Path("build/bedrock-asset-audit")
          live = work / "SlimefunLegacyRP_GEYSER-BEDROCK.zip"
          old = Path("compatibility/bedrock/SFL_GEYSER_RP_experimental_v1.0.3_complete.zip")
          original_pin = validator.load_pin(Path("compatibility/bedrock-resource-pack-release.json"))
          expected = "2f880ca6100837657fbc05daf3b383f2c3a5e5c0db58339087885b7ebebbf88e"
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def inspect(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  if len(names) != len(set(names)):
                      raise ValueError(f"duplicate ZIP entries in {path}")
                  if z.testzip() is not None:
                      raise ValueError(f"corrupted ZIP entry in {path}")
                  if any(name.startswith("/") or "\\" in name or ".." in name.split("/")
                         for name in names):
                      raise ValueError(f"unsafe member path in {path}")
                  if any(stat.S_IFMT(info.external_attr >> 16) == stat.S_IFLNK for info in z.infolist()):
                      raise ValueError(f"symlink member in {path}")
                  return ({name: sha(z.read(name)) for name in names if not name.endswith("/")},
                          {name: len(z.read(name)) for name in names if not name.endswith("/")},
                          {info.filename: info.compress_type for info in z.infolist() if not info.is_dir()})
          old_sha, old_size, old_method = inspect(old)
          new_sha, new_size, new_method = inspect(live)
          new_pin = copy.deepcopy(original_pin)
          new_pin["sha256"] = expected
          new_pin["size_bytes"] = 1338619
          report = {
              "schema": 1,
              "source": {"path": str(old), "sha256": sha(old.read_bytes()), "files": len(old_sha)},
              "public": {"name": live.name, "sha256": sha(live.read_bytes()), "size": live.stat().st_size,
                         "files": len(new_sha)},
              "member_diff": {
                  "unchanged": sorted(x for x in old_sha if x in new_sha and old_sha[x] == new_sha[x]),
                  "changed": sorted(x for x in old_sha if x in new_sha and old_sha[x] != new_sha[x]),
                  "removed": sorted(set(old_sha) - set(new_sha)),
                  "added": sorted(set(new_sha) - set(old_sha))
              },
              "compression": {"historical": sorted(set(old_method.values())),
                              "public": sorted(set(new_method.values()))},
              "mapping_count": len([x for x in new_sha if x.startswith("custom_mappings/") and x.endswith(".json")]),
              "required_packs": {
                  "slimefun": "packs/SlimefunBedrockRP_1.0.1.mcpack" in new_sha,
                  "valhalla": "packs/Albion_ValhallaMMO_Bedrock_1.0.1.mcpack" in new_sha
              },
              "strict_validation": "NOT_RUN"
          }
          try:
              validator.verify_zip(old, original_pin)
              validator.verify_zip(live, new_pin)
              report["strict_validation"] = "PASS"
          except (Exception) as error:
              report["strict_validation"] = "FAIL"
              report["strict_error"] = f"{type(error).__name__}: {error}"
          report_path = work / "comparison.json"
          report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "source_sha256": report["source"]["sha256"],
              "public_sha256": report["public"]["sha256"],
              "total_public_files": report["public"]["files"],
              "mapping_count": report["mapping_count"],
              "compression": report["compression"],
              "required_packs": report["required_packs"],
              "diff_counts": {k: len(v) for k,v in report["member_diff"].items()},
              "added": report["member_diff"]["added"],
              "removed": report["member_diff"]["removed"],
              "changed": report["member_diff"]["changed"],
              "strict_status": report["strict_validation"],
              "strict_error": report.get("strict_error")
          }, indent=2))
          # The existing v1.0.3 production verifier MUST still reject the changed
          # layout. This read-only audit records that expected rejection separately
          # from the new pack's structural inspection. It does not approve carry-forward.
          if report["strict_validation"] != "FAIL" or not report.get("strict_error", "").startswith(
              "ValueError: Unexpected files in the pinned Bedrock drop-in ZIP"
          ):
              raise SystemExit("Unexpected historical validation result: " + repr(report.get("strict_error")))
          print("EXPECTED_V1_0_3_REJECTION: current experimental pack requires independent source acceptance.")
          PY

      - name: Inspect all custom mappings and nested pack manifests without modifying them
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter, defaultdict
          from io import BytesIO
          from pathlib import Path
          import json, zipfile
          work = Path("build/bedrock-asset-audit")
          live = work / "SlimefunLegacyRP_GEYSER-BEDROCK.zip"
          if not live.is_file():
              print("No public archive was downloaded; inspect release download step.")
              raise SystemExit(0)
          result = {"public_archive": live.name, "mapping_files": [],
                    "nested_packs": [], "identifier_duplicates": [], "errors": []}
          identifiers = defaultdict(list)
          try:
              with zipfile.ZipFile(live) as outer:
                  names = sorted(outer.namelist())
                  for name in names:
                      if name.startswith("custom_mappings/") and name.endswith(".json"):
                          try:
                              raw = outer.read(name)
                              parsed = json.loads(raw)
                              info = {"name": name, "bytes": len(raw),
                                      "format": parsed.get("format_version"),
                                      "keys": sorted(parsed),
                                      "items": len(parsed.get("items", {})) if isinstance(parsed.get("items"), dict) else None,
                                      "skull_hashes": len(parsed.get("skulls", {}).get("skin_hash", []))
                                        if isinstance(parsed.get("skulls"), dict) else None}
                              for java_item, rules in parsed.get("items", {}).items():
                                  if isinstance(rules, list):
                                      for rule in rules:
                                          if not isinstance(rule, dict):
                                              continue
                                          custom_identifier = rule.get("bedrock_identifier")
                                          if not isinstance(custom_identifier, str) and isinstance(rule.get("name"), str):
                                              legacy = rule["name"]
                                              custom_identifier = legacy if ":" in legacy else "geyser_custom:" + legacy
                                          if isinstance(custom_identifier, str):
                                              identifiers[custom_identifier].append(name + ":" + java_item)
                              result["mapping_files"].append(info)
                              if "Pilot" in name:
                                  print("PILOT MAP:", json.dumps(info, sort_keys=True))
                                  print("PILOT SAMPLE:", json.dumps(parsed, ensure_ascii=False)[:900])
                          except Exception as e:
                              result["errors"].append("Mapping JSON " + name + ": " + str(e))
                      if name.endswith(".mcpack"):
                          pack_info = {"name": name}
                          try:
                              with zipfile.ZipFile(BytesIO(outer.read(name))) as pack:
                                  bad = pack.testzip()
                                  if bad is not None:
                                      raise ValueError("Bad member CRC: " + bad)
                                  members = pack.namelist()
                                  manifest_names = [x for x in members if x.endswith("manifest.json")]
                                  pack_info.update({"files": len(members),
                                      "textures": sum(x.endswith(".png") for x in members),
                                      "manifest_paths": manifest_names})
                                  for manifest_path in manifest_names:
                                      data = json.loads(pack.read(manifest_path))
                                      pack_info["manifest"] = {"format_version": data.get("format_version"),
                                          "header": {"uuid": data.get("header", {}).get("uuid"),
                                                     "version": data.get("header", {}).get("version"),
                                                     "name": data.get("header", {}).get("name")},
                                          "modules": [{"type": x.get("type"), "uuid": x.get("uuid"), "version": x.get("version")}
                                                      for x in data.get("modules", []) if isinstance(x, dict)]}
                                  if not manifest_names:
                                      result["errors"].append("Missing pack manifest: " + name)
                          except Exception as e:
                              result["errors"].append("Nested pack " + name + ": " + str(e))
                          result["nested_packs"].append(pack_info)
                  result["identifier_duplicates"] = [
                      {"identifier": key, "uses": locations}
                      for key, locations in sorted(identifiers.items()) if len(set(locations)) > 1
                  ][:30]
          except Exception as e:
              result["errors"].append("Top-level inspection: " + str(e))
          target = work / "deep-inspection.json"
          target.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"mapping_count": len(result["mapping_files"]),
                            "packs": result["nested_packs"],
                            "duplicate_bedrock_identifiers": result["identifier_duplicates"][:12],
                            "errors": result["errors"]}, indent=2)[:17000])
          PY

      - name: Verify exact public v1.0.4 layout and six pilot textures (not client certification)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from collections import Counter
          import hashlib,json
          work=Path('build/bedrock-asset-audit')
          report=json.loads((work/'comparison.json').read_text())
          detail=json.loads((work/'deep-inspection.json').read_text())
          assert report['strict_validation']=='FAIL'
          assert report['strict_error'].startswith('ValueError: Unexpected files in the pinned Bedrock drop-in ZIP')
          assert report['source']['files']==28 and report['public']['files']==29
          assert report['mapping_count']==25
          assert {k:len(v) for k,v in report['member_diff'].items()}=={'unchanged':19,'changed':6,'removed':3,'added':4}
          assert not detail['errors'] and not detail['identifier_duplicates']
          pilot={
            'custom_mappings/Albion_SFL_V2_Heads_Pilot.json':{
              'motor':('minecraft:player_head',2200510),'input':('minecraft:player_head',2200513),
              'output':('minecraft:player_head',2200514)},
            'custom_mappings/Albion_SFL_V2_Scaling_Pilot.json':{
              'ore_crusher':('minecraft:dispenser',2200028),'tin_ingot':('minecraft:iron_ingot',2200106),
              'pressure_chamber':('minecraft:glass',2200059)},
          }
          pack_info={
            'packs/SlimefunBedrockRP_1.0.4.mcpack':(
              '8074dbb0d709dd738441c79a4033914f8b96fbfe2a9fdaef95e153526ef90ccc',
              'f3e14cb9-aea6-58a4-bd52-1bc3c9b9084a',[1,0,4]),
            'packs/Albion_ValhallaMMO_Bedrock_1.0.1.mcpack':(
              'ac306c82a06b186af2754e450740f7a57459c8ba3ccc2e0f63f165c510929742',
              '38dd6eec-1713-5df4-9e88-037b3279d6cc',[1,0,1]),
            'packs/Albion_ValhallaMMO_Stat_Icons_1.0.0.mcpack':(
              'cf8111461c228bb2eb37f65ee39ef201cd575268a01fce77b4b06ebce03346ea',
              '35ecb947-e889-57f1-86b1-026bd364f549',[1,0,0]),
          }
          pub=work/'SlimefunLegacyRP_GEYSER-BEDROCK.zip'
          assert pub.stat().st_size==1338619
          assert hashlib.sha256(pub.read_bytes()).hexdigest()=='2f880ca6100837657fbc05daf3b383f2c3a5e5c0db58339087885b7ebebbf88e'
          with ZipFile(pub) as outer:
            paths=set(outer.namelist())
            maps=sorted(x for x in paths if x.startswith('custom_mappings/') and x.endswith('.json'))
            assert len(paths)==29 and len(maps)==25 and set(pilot)<=paths
            assert {x for x in paths if x.endswith('.mcpack')}==set(pack_info)
            formats=Counter()
            skin_hashes=set()
            used_cmd=set()
            actual_pilot={}
            icons=[]
            for name in maps:
              doc=json.loads(outer.read(name));formats[str(doc['format_version'])]+=1
              if 'skulls' in doc:
                hashes=doc['skulls']['skin_hash']
                assert len(hashes)==(90 if 'legacy' in name else 1453)
                assert len(hashes)==len(set(hashes)) and skin_hashes.isdisjoint(hashes)
                skin_hashes.update(hashes)
                continue
              for java,rules in doc['items'].items():
                for rule in rules:
                  cmd=rule.get('custom_model_data')
                  if type(cmd) is int:
                    assert (java,cmd) not in used_cmd
                    used_cmd.add((java,cmd))
                  icon=(rule.get('bedrock_options') or {}).get('icon') or rule.get('icon') or rule.get('name')
                  if icon and 'valhallammo_mappings' not in name:icons.append((name,icon))
                  if name in pilot:
                    assert doc['format_version']==2 and rule.get('type')=='legacy'
                    assert rule['bedrock_identifier'].startswith('geyser_custom:')
                    actual_pilot.setdefault(name,{})[icon]=(java,cmd)
            assert formats=={'1':22,'2':3} and len(skin_hashes)==1543
            assert actual_pilot==pilot
            for name,(sha,uuid,version) in pack_info.items():
              data=outer.read(name)
              assert hashlib.sha256(data).hexdigest()==sha
              with ZipFile(BytesIO(data)) as pack:
                assert pack.testzip() is None
                files=set(pack.namelist())
                manifest=json.loads(pack.read(next(p for p in files if p.endswith('manifest.json'))))
                assert manifest['header']['uuid']==uuid and manifest['header']['version']==version
                if 'SlimefunBedrockRP' in name:
                  base='SFB-RP/'
                  atlas=json.loads(pack.read(base+'textures/item_texture.json'))['texture_data']
                  assert len(atlas)==562
                  absent=[]
                  for source,icon in icons:
                    assert icon in atlas, 'Missing Slimefun icon: '+icon
                    for tex in atlas[icon]['textures']:
                      if base+tex+'.png' not in files:absent.append((source,icon,tex))
                  assert absent==[('custom_mappings/SF-Energy&Electricity.json','BASE',
                                  'textures/items/armaduras/_armor/BASE')],absent
          proof={'result':'EXPERIMENTAL_STRUCTURE_PASS_NOT_CLIENT_CERTIFIED',
                 'history':'v1.0.3 layout correctly rejected','asset_sha256':hashlib.sha256(pub.read_bytes()).hexdigest(),
                 'mapping_files':len(maps),'pilot_models':sum(map(len,pilot.values())),
                 'skull_hashes':len(skin_hashes),'unresolved_texture':'BASE.png',
                 'approved_carry_forward_tags':[],'client_visual_validation':False}
          (work/'static-v104-experimental.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY

      - name: Preserve exact public ZIP bytes for independently reproducible audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-v4176-bedrock-public-bytes
          path: build/bedrock-asset-audit/SlimefunLegacyRP_GEYSER-BEDROCK.zip
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve full read-only comparison and release input metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-v4176-bedrock-comparison
          path: |
            build/bedrock-asset-audit/comparison.json
            build/bedrock-asset-audit/release.json
            build/bedrock-asset-audit/deep-inspection.json
            build/bedrock-asset-audit/static-v104-experimental.json
          retention-days: 30
          if-no-files-found: warn
