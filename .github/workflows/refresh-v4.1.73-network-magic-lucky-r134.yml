name: Refresh v4.1.73 addon bundle with Networks Magic Lucky (r134)

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-v4.1.73-network-magic-lucky-r134.yml'
      - 'compatibility/bundle-refresh-r134.json'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'docs/addon-bundle-r134.md'
      - 'scripts/refresh_release_addon.py'
      - 'scripts/refresh_release_addons_r134.py'
      - 'scripts/test_refresh_release_addon.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-v4.1.73-network-magic-lucky-r134.yml'
      - 'compatibility/bundle-refresh-r134.json'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'docs/addon-bundle-r134.md'
      - 'scripts/refresh_release_addon.py'
      - 'scripts/refresh_release_addons_r134.py'
      - 'scripts/test_refresh_release_addon.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-v4.1.73-r134-networks-magic-lucky
  cancel-in-progress: false

jobs:
  revision_scope:
    name: Check whether archived r134 refresh still applies
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.read.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
      - name: Read the checked-out source manifest revision
        id: read
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path("compatibility/sfl-addon-release-matrix.json").read_text())
          print("revision=" + str(manifest["bundle_revision"]))
          PY

  prepare:
    name: Validate exactly three JAR replacements (45 preserved)
    needs: revision_scope
    if: needs.revision_scope.outputs.revision == '134' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish addon bundle r134 with Networks Magic Lucky'))
    runs-on: ubuntu-latest
    timeout-minutes: 22
    outputs:
      digest: ${{ steps.stage.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Run archive preservation and bytecode regression tests
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_refresh_release_addon.py scripts/test_verify_published_addon_bundle.py scripts/test_verify_addon_bytecode.py
      - name: Download exact published r133 inputs and official replacement releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/current work/new
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.1.73" > work/release-before.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > work/latest.json
          gh release download v4.1.73 --repo "$GITHUB_REPOSITORY" \
            --pattern SF_Addons_1.21.11-26.3.zip \
            --pattern Slimefun-Legacy4.1.73.jar \
            --pattern SlimefunLegacyRP.zip --dir work/current
          gh release download v1.0.53 --repo wickidcow/SF_NetworksExp \
            --pattern SF_Networks1.0.53.jar --dir work/new
          gh release download v1.1.11 --repo wickidcow/SF_MagicExpansion \
            --pattern SF_MagicExpansion1.1.11.jar --dir work/new
          gh release download v1.0.5 --repo wickidcow/SF_LuckyBlocks \
            --pattern SF_LuckyBlocks1.0.5.jar --dir work/new
      - name: Verify the current release lease and input artifact identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          cfg = json.loads(Path('compatibility/bundle-refresh-r134.json').read_text())
          release = json.loads(Path('work/release-before.json').read_text())
          latest = json.loads(Path('work/latest.json').read_text())
          assert cfg['bundle_revision'] == 134 and cfg['expected_addons'] == 45
          assert release['tag_name'] == latest['tag_name'] == cfg['release_tag']
          assert release['target_commitish'] == cfg['core_source_commit']
          assets = {a['name']: a for a in release['assets']}
          assert set(assets) == {cfg['bundle_name'], cfg['core_jar'], cfg['resource_pack']}
          for name, sha in ((cfg['bundle_name'], cfg['published_old_bundle_sha256']),
                            (cfg['core_jar'], cfg['core_sha256']),
                            (cfg['resource_pack'], cfg['resource_pack_sha256'])):
              assert assets[name]['digest'] == 'sha256:' + sha, 'Release asset changed: ' + name
              assert hashlib.sha256((Path('work/current') / name).read_bytes()).hexdigest() == sha
          assert len(cfg['replacements']) == 3
          for item in cfg['replacements']:
              b = (Path('work/new') / item['new_jar']).read_bytes()
              assert hashlib.sha256(b).hexdigest() == item['new_sha256'], item['new_jar']
          print('Exact release lease, three add-on digests and unchanged core/resource verified')
          PY
      - name: Construct and independently verify deterministic r134 archive
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/refresh_release_addons_r134.py \
            --config compatibility/bundle-refresh-r134.json \
            --matrix compatibility/sfl-addon-release-matrix.json \
            --original work/current/SF_Addons_1.21.11-26.3.zip \
            --jar-dir work/new \
            --output work/SF_Addons_1.21.11-26.3.zip \
            --work-dir work/stages > work/r134-validation.json
          python3 scripts/verify_published_addon_bundle.py work/SF_Addons_1.21.11-26.3.zip
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          report = json.loads(Path('work/r134-validation.json').read_text())
          cfg = json.loads(Path('compatibility/bundle-refresh-r134.json').read_text())
          manifest = json.loads(zipfile.ZipFile('work/SF_Addons_1.21.11-26.3.zip')
                                .read('SF_ADDON_MANIFEST.json'))
          assert report['addon_count'] == 45 and report['unchanged_addons'] == 42
          assert report['bundle_revision'] == 134 == manifest['bundle_revision']
          assert len(report['changed_repositories']) == len(cfg['replacements']) == 3
          assert report['changed_repositories'] == [r['repository'] for r in cfg['replacements']]
          assert len(manifest['addons']) == 45
          candidate = Path('work/SF_Addons_1.21.11-26.3.zip')
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          assert digest == report['bundle_sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + digest + '\n')
          print('r134 validated: exactly 3 updated and 42 byte-identical addons, SHA-256', digest)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: addon-bundle-r134-network-magic-lucky-candidate
          path: |
            work/SF_Addons_1.21.11-26.3.zip
            work/r134-validation.json
            work/release-before.json
            work/stages/stage-1-validation.json
            work/stages/stage-2-validation.json
            work/stages/stage-3-validation.json
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Replace addon ZIP only after exact release-lease verification
    needs: prepare
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish addon bundle r134 with Networks Magic Lucky')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: addon-bundle-r134-network-magic-lucky-candidate
          path: work
      - name: Revalidate the exact live release and reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.1.73" > work/live-before.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > work/live-latest.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          cfg = json.loads(Path('compatibility/bundle-refresh-r134.json').read_text())
          r = json.loads(Path('work/live-before.json').read_text())
          latest = json.loads(Path('work/live-latest.json').read_text())
          report = json.loads(Path('work/r134-validation.json').read_text())
          assert r['tag_name'] == latest['tag_name'] == cfg['release_tag']
          assert r['target_commitish'] == cfg['core_source_commit']
          assets = {a['name']: a for a in r['assets']}
          assert set(assets) == {cfg['core_jar'], cfg['resource_pack'], cfg['bundle_name']}
          assert assets[cfg['core_jar']]['digest'] == 'sha256:' + cfg['core_sha256']
          assert assets[cfg['resource_pack']]['digest'] == 'sha256:' + cfg['resource_pack_sha256']
          assert assets[cfg['bundle_name']]['digest'] == 'sha256:' + cfg['published_old_bundle_sha256'], \
              'Published ZIP was updated by another workflow: refuse to overwrite'
          candidate = Path('work') / cfg['bundle_name']
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          assert digest == report['bundle_sha256'] == os.environ['CANDIDATE_DIGEST']
          assert report['bundle_revision'] == 134 and report['unchanged_addons'] == 42
          assert report['addon_count'] == 45
          print('Final release lease and candidate digest verified, publication permitted')
          PY
          python3 scripts/verify_published_addon_bundle.py work/SF_Addons_1.21.11-26.3.zip
      - name: Publish the reviewed ZIP without touching core or resource pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v4.1.73 work/SF_Addons_1.21.11-26.3.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.1.73" > work/release-after.json
      - name: Verify live digests and append accurate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          cfg = json.loads(Path('compatibility/bundle-refresh-r134.json').read_text())
          release = json.loads(Path('work/release-after.json').read_text())
          assets = {a['name']: a for a in release['assets']}
          assert len(assets) == 3
          assert assets[cfg['bundle_name']]['digest'] == 'sha256:' + os.environ['CANDIDATE_DIGEST']
          assert assets[cfg['core_jar']]['digest'] == 'sha256:' + cfg['core_sha256']
          assert assets[cfg['resource_pack']]['digest'] == 'sha256:' + cfg['resource_pack_sha256']
          body = release.get('body') or ''
          previous = ('The addon ZIP is now at **revision 133**, including **FNAmplifications 4.2.8** '
                      'and the **Supreme 1.0.20 Soulbound/armor effects rebuild**.')
          current = ('The addon ZIP is now at **revision 134**, including **Networks 1.0.53**, '
                     '**Magic Expansion 1.1.11**, and **Lucky Blocks 1.0.5**, while retaining '
                     'the FNAmplifications 4.2.8 and Supreme 1.0.20 fixes.')
          body = body.replace(previous, current)
          marker = '## Addon bundle refresh — revision 134'
          note = Path('docs/addon-bundle-r134.md').read_text()
          assert note.startswith(marker)
          if marker not in body:
              body = body.rstrip() + '\n\n' + note
          Path('work/release-notes.md').write_text(body)
          print('Published r134 with 45 addons, three replacements, core and RP unchanged')
          PY
          gh release edit v4.1.73 --repo "$GITHUB_REPOSITORY" \
            --notes-file work/release-notes.md
