name: r137 exact-byte release candidate

on:
  pull_request:
    paths:
      - '.github/workflows/r137-release-candidate.yml'
      - 'compatibility/r137-release-candidate.json'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'scripts/prepare_r137_release_candidate.py'
      - 'scripts/test_r137_release_candidate.py'
      - 'scripts/runtime/black_market/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r137-exact-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revision_scope:
    name: Check whether the archived r137 candidate still applies
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.read.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read the checked-out addon bundle revision
        id: read
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          matrix = json.loads(Path("compatibility/sfl-addon-release-matrix.json").read_text())
          print("revision=" + str(matrix["bundle_revision"]))
          PY

  prepare:
    name: Preserve 44 published JARs and the published core
    needs: revision_scope
    if: needs.revision_scope.outputs.revision == '137'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify offline admission contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_r137_release_candidate.py' -v
          python3 -m unittest discover -s scripts -p 'test_black_market_probe_contracts.py' -v
      - name: Prepare exact source-CI JAR plus published r136 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare_r137_release_candidate.py \
            --config compatibility/r137-release-candidate.json \
            --matrix compatibility/sfl-addon-release-matrix.json \
            --output build/r137-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: r137-exact-candidate
          path: |
            build/r137-candidate/SF_Addons_1.21.11-26.3.zip
            build/r137-candidate/SF_MagicExpansion1.1.13.jar
            build/r137-candidate/Slimefun-Legacy-full-stack.jar
            build/r137-candidate/release-readiness.json
          if-no-files-found: error

  runtime:
    name: Published-core r137 on ${{ matrix.software }} ${{ matrix.minecraft }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {software: paper, minecraft: '1.21.11', java: '21', lane: '1.21.11'}
          - {software: paper, minecraft: '26.2', java: '25', lane: '26.2'}
          - {software: paper, minecraft: '26.3', java: '25', lane: '26.3'}
          - {software: purpur, minecraft: '26.3', java: '25', lane: 'purpur-26.3'}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: r137-exact-candidate
          path: candidate
      - name: Boot the frozen release candidate twice
        env:
          SERVER_SOFTWARE: ${{ matrix.software }}
          SERVER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          PURPUR_SMOKE_BUILD: '2646'
          SERVER_DOWNLOAD_USER_AGENT: Slimefun-Legacy-r137-Release-Candidate/1.0
        run: |
          bash scripts/full_stack_runtime_smoke.sh \
            candidate/Slimefun-Legacy-full-stack.jar \
            candidate/SF_Addons_1.21.11-26.3.zip \
            "build/full-stack-${{ matrix.lane }}"
      - name: Verify native Networks and Fluffy conservation
        if: matrix.software == 'paper' && matrix.minecraft == '26.3'
        run: |
          python3 scripts/runtime/r135_fluffy_networks/run_probe.py \
            --runtime-dir build/full-stack-26.3 \
            --bundle candidate/SF_Addons_1.21.11-26.3.zip
      - name: Verify native Black Market receipts across four JVMs
        run: |
          python3 scripts/runtime/black_market/run_probe.py \
            --runtime-dir "build/full-stack-${{ matrix.lane }}" \
            --bundle candidate/SF_Addons_1.21.11-26.3.zip \
            --allow-disposable-writes
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r137-native-evidence-${{ matrix.lane }}
          path: |
            build/full-stack-${{ matrix.lane }}/*.console.log
            build/full-stack-${{ matrix.lane }}/*.normalized.log
            build/full-stack-${{ matrix.lane }}/runtime-build.txt
            build/full-stack-${{ matrix.lane }}/smoke-result.txt
            build/full-stack-${{ matrix.lane }}/black-market-result.json
            build/full-stack-${{ matrix.lane }}/black-market-compile.log
            build/full-stack-${{ matrix.lane }}/native-r135-result.json
            build/full-stack-${{ matrix.lane }}/native-r135-compile.log
            build/full-stack-${{ matrix.lane }}/plugins/BlackMarketRestartProbe/*.result
          if-no-files-found: error

  ready:
    name: Verify all four runtime results and unchanged release lease
    needs: [prepare, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: r137-exact-candidate
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          pattern: r137-native-evidence-*
          path: evidence
      - name: Require exact-byte, non-skipped native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from prepare_r137_release_candidate import gh_json, validate_release
          config = json.loads(Path('compatibility/r137-release-candidate.json').read_text())
          candidate = json.loads(Path('candidate/release-readiness.json').read_text())
          expected_bundle = hashlib.sha256(Path('candidate/SF_Addons_1.21.11-26.3.zip').read_bytes()).hexdigest()
          expected_core = config['baseline_assets']['Slimefun-Legacy4.1.74.jar']['sha256']
          assert candidate['bundle_sha256'] == expected_bundle
          assert candidate['published_core_sha256'] == expected_core
          assert candidate['unchanged_addons'] == 44
          lanes = ['1.21.11', '26.2', '26.3', 'purpur-26.3']
          checked = {}
          for lane in lanes:
              root = Path('evidence') / f'r137-native-evidence-{lane}'
              matches = list(root.rglob('black-market-result.json'))
              assert len(matches) == 1, lane
              report = json.loads(matches[0].read_text())
              assert report['result'] == 'PASS'
              assert report['bundle_sha256'] == expected_bundle
              assert report['core_sha256'] == expected_core
              assert report['tested_addons']['wickidcow/SF_MagicExpansion']['sha256'] == config['new_sha256']
              assert [phase['phase'] for phase in report['phases']] == ['seed', 'verify', 'missing', 'restored']
              for phase in report['phases']:
                  assert phase['result'] == 'PASS' and phase['exit_code'] == 0 and phase['assertions'] >= 10
                  log = matches[0].parent / f"black-market-{phase['phase']}.console.log"
                  assert hashlib.sha256(log.read_bytes()).hexdigest() == phase['console_sha256']
              if lane == '26.3':
                  network = json.loads((matches[0].parent / 'native-r135-result.json').read_text())
                  assert network['result'] == 'PASS' and network['process_exit_code'] == 0
                  assert network['core_jar_sha256'] == expected_core
              checked[lane] = report
          validate_release(gh_json('repos/wickidcow/Slimefun-Legacy/releases/tags/v4.1.74'), config)
          Path('release-ready.json').write_text(json.dumps({
              'gate': 'PASS', 'publication': 'NOT_PUBLISHED', 'run_id': os.environ['GITHUB_RUN_ID'],
              'candidate': candidate, 'runtime_lanes': checked,
              'limits': 'Synthetic store/restart validation, not a live-state repair or crash-atomicity proof.'
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: r137-release-ready-evidence
          path: release-ready.json
          if-no-files-found: error
