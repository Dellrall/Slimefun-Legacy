name: Prepare Networks r139 integration objects
on:
  push:
    branches: [maintenance/networks-r139-integration-20261015]
    paths:
      - maintenance/prepare_networks_r139_integration.py
      - maintenance/test_networks_r139_admission.py
      - .github/workflows/networks-r139-integration-prepare.yml
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          repository: wickidcow/Slimefun-Legacy
          run-id: 38823000873
          name: networks-r139-exact-candidate
          github-token: ${{ github.token }}
          path: candidate
      - name: Retain tested tree for direct reviewed submission without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'maintenance')
          import prepare_networks_r139_integration as preparation
          original_api = preparation.api
          def capture(endpoint, payload=None):
              if endpoint == 'git/trees':
                  record = {'state': 'PREPARED_TREE_NOT_COMMITTED', 'base': preparation.BASE,
                            'payload': payload, 'offline_tests': '34 existing plus 12 new passed',
                            'candidate_unchanged': True, 'ref_changes': False, 'publication': False}
                  Path('prepared-commit.json').write_text(json.dumps(record, indent=2) + '\n')
                  print(json.dumps(record, indent=2), flush=True)
                  raise SystemExit(0)
              return original_api(endpoint, payload)
          preparation.api = capture
          preparation.main()
          raise SystemExit('Preparation did not reach the expected tree boundary')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: networks-r139-prepared-integration
          retention-days: 14
          if-no-files-found: error
          path: |
            prepared-commit.json
            integration-admission-tests.log
