name: Addons r140 Magic + Networks + IE2 candidate

on:
  push:
    branches: ['bundle/addons-r140-networks-ie2-20261016']
    paths:
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'compatibility/r140-release-candidate.json'
      - 'scripts/refresh_release_addons_r140.py'
      - '.github/workflows/addons-r140-candidate.yml'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Build exact r140 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download exact published r137 baseline and public replacement JARs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/baseline .ci/jars build/r140
          gh release download v4.1.74 --repo wickidcow/Slimefun-Legacy \
            --pattern 'SF_Addons_1.21.11-26.3.zip' --dir .ci/baseline
          gh release download v1.1.15 --repo wickidcow/SF_MagicExpansion \
            --pattern 'SF_MagicExpansion1.1.15.jar' --dir .ci/jars
          gh release download v1.0.57 --repo wickidcow/SF_NetworksExp \
            --pattern 'SF_Networks1.0.57.jar' --dir .ci/jars
          gh release download v2.0.14 --repo wickidcow/SF_InfinityExpansion2 \
            --pattern 'SF_InfinityExpansion2.0.14.jar' --dir .ci/jars
          printf '%s\n' \
            '534768b57854fdc21280bda483266217a61bc140a48df3f246c71842c82b173d  .ci/baseline/SF_Addons_1.21.11-26.3.zip' \
            '46c01290c54d918c39e8bb0f58d3ce135e2143c86b0f45858245f78fcafeeaad  .ci/jars/SF_MagicExpansion1.1.15.jar' \
            '125a54605244f3ecaa2d873cca4dff7a78ff7772a445ad5d6f4c38f3603d57ab  .ci/jars/SF_Networks1.0.57.jar' \
            '4c3d5a19b751d13f769937d6e5faf18f67ddb40465db3d9759a1d8800c0cbdb9  .ci/jars/SF_InfinityExpansion2.0.14.jar' | sha256sum --check

      - name: Build deterministic two-addon r140
        run: |
          python3 scripts/refresh_release_addons_r140.py \
            --config compatibility/r140-release-candidate.json \
            --matrix compatibility/sfl-addon-release-matrix.json \
            --original .ci/baseline/SF_Addons_1.21.11-26.3.zip \
            --jar-dir .ci/jars \
            --output build/r140/SF_Addons_r140_1.21.11-26.3.zip \
            --work-dir build/r140/work | tee build/r140/build-report.json
          python3 scripts/verify_published_addon_bundle.py \
            build/r140/SF_Addons_r140_1.21.11-26.3.zip
          sha256sum build/r140/SF_Addons_r140_1.21.11-26.3.zip

      - uses: actions/upload-artifact@v7
        with:
          name: sf-addons-r140-candidate
          path: |
            build/r140/SF_Addons_r140_1.21.11-26.3.zip
            build/r140/build-report.json
            build/r140/work/r140-result.json
            build/r140/work/stage-1-report.json
            build/r140/work/stage-2-report.json
          retention-days: 14
          if-no-files-found: error

  runtime:
    name: Full stack / ${{ matrix.lane }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {software: paper, minecraft: '1.21.11', java: '21', lane: 'paper-1.21.11'}
          - {software: paper, minecraft: '26.2', java: '25', lane: 'paper-26.2'}
          - {software: paper, minecraft: '26.3', java: '25', lane: 'paper-26.3'}
          - {software: purpur, minecraft: '26.3', java: '25', lane: 'purpur-26.3'}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: sf-addons-r140-candidate
          path: candidate
      - name: Download exact published Slimefun Legacy 4.1.74 core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci/core
          gh release download v4.1.74 --repo wickidcow/Slimefun-Legacy \
            --pattern 'Slimefun-Legacy4.1.74.jar' --dir .ci/core
          echo '72a524d7c0d6f75a9decbf06679515887273ae53673d3f5ee38f355bef952c96  .ci/core/Slimefun-Legacy4.1.74.jar' | sha256sum --check
      - name: Run two-boot complete stack
        env:
          SERVER_SOFTWARE: ${{ matrix.software }}
          SERVER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          SLIMEFUN_SMOKE_VERSION: '4.1.74'
          PURPUR_SMOKE_BUILD: '2646'
          SERVER_DOWNLOAD_USER_AGENT: Slimefun-Legacy-r140/1.0
        run: |
          bash scripts/full_stack_runtime_smoke.sh \
            .ci/core/Slimefun-Legacy4.1.74.jar \
            candidate/SF_Addons_r140_1.21.11-26.3.zip \
            'build/full-stack-${{ matrix.lane }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sf-addons-r140-runtime-${{ matrix.lane }}
          path: |
            build/full-stack-${{ matrix.lane }}/smoke-result.txt
            build/full-stack-${{ matrix.lane }}/first.normalized.log
            build/full-stack-${{ matrix.lane }}/second.normalized.log
            build/full-stack-${{ matrix.lane }}/runtime-build.txt
            build/full-stack-${{ matrix.lane }}/expected-addons.txt
            build/full-stack-${{ matrix.lane }}/dependency-gated-addons.txt
          retention-days: 14
          if-no-files-found: warn

  ready:
    name: r140 exact candidate ready
    needs: [prepare, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sf-addons-r140-candidate
          path: candidate
      - name: Record exact approved candidate digest
        run: |
          set -euo pipefail
          test -s candidate/SF_Addons_r140_1.21.11-26.3.zip
          sha256sum candidate/SF_Addons_r140_1.21.11-26.3.zip | tee r140-ready.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: sf-addons-r140-ready
          path: r140-ready.sha256
          retention-days: 14
          if-no-files-found: error
