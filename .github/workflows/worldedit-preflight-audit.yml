name: WorldEdit read-only dependency audit

on:
  push:
    branches: ['ci/worldedit-preflight-20261015']
    paths: ['.github/workflows/worldedit-preflight-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldedit-preflight-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 66b1f89189629e583a07d9733db94c458b1a45f0
          persist-credentials: false
      - name: Inspect bounded explicit alternatives without changing runtime selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from scripts.prepare_worldedit_runtime import (
              API, object_json, request_bytes, select_version, stage, validate_project)

          # Prior audit preserved four exact 404 failures for official 7.4.6
          # YFnqiUlL. This is a separate bounded review of explicit alternatives,
          # not fallback logic and not a change to normal full-stack validation.
          reports = []
          project = object_json(request_bytes(f'{API}/project/worldedit', 1024 * 1024,
                                              allowed_host='api.modrinth.com'), 'project')
          project_id = validate_project(project)
          with TemporaryDirectory(prefix='worldedit-audit-') as temporary:
              for minecraft in ('1.21.11', '26.2', '26.3'):
                  query = urlencode({'game_versions': json.dumps([minecraft])})
                  versions = object_json(request_bytes(
                      f'{API}/project/{quote(project_id)}/version?{query}', 4 * 1024 * 1024,
                      allowed_host='api.modrinth.com'), 'versions')
                  # Preserve the selected metadata in the report even if download fails.
                  remaining = [v for v in versions if v.get('id') != 'YFnqiUlL']
                  for attempt in range(3):
                      try:
                          selected = select_version(remaining, project_id, minecraft,
                                                    allow_prerelease=minecraft == '26.3')
                      except ValueError as error:
                          reports.append({'minecraft': minecraft, 'status': 'no-further-candidate',
                                          'reason': str(error)})
                          break
                      requested = selected['id']
                      remaining = [v for v in remaining if v.get('id') != requested]
                      entry = {'minecraft': minecraft, 'requested_version_id': requested,
                               'version_number': selected.get('version_number'),
                               'published': selected.get('date_published'),
                               'scope': 'explicit dependency review only; not a runtime pass or selected pin'}
                      try:
                          result = stage(Path(temporary) / f'{minecraft}-{requested}', minecraft,
                                         allow_prerelease=minecraft == '26.3', version_id=requested)
                          entry.update(status='verified', evidence=result)
                      except HTTPError as error:
                          entry.update(status='failed', exception=type(error).__name__,
                                       http_status=error.code, url=error.geturl(), reason=str(error.reason))
                      except Exception as error:
                          entry.update(status='failed', exception=type(error).__name__, reason=str(error))
                      reports.append(entry)
                      print(json.dumps(entry, sort_keys=True), flush=True)
          Path('audit/worldedit-preflight.json').write_text(json.dumps(reports, indent=2) + '\n')
          missing = [mc for mc in ('1.21.11', '26.2', '26.3')
                     if not any(e['minecraft'] == mc and e['status'] == 'verified' for e in reports)]
          if missing:
              raise SystemExit(f'No verified reviewed alternative for lanes: {missing}')
          print('Verified alternatives found; no runtime selection or server files were changed')
          PY
      - name: Preserve public dependency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldedit-preflight-evidence
          path: audit/worldedit-preflight.json
          retention-days: 14
          if-no-files-found: error
