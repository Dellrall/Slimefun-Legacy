name: Refresh v4.1.73 addon bundle with Supreme armor fixes (r133)

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-v4.1.73-supreme-armor-r133.yml'
      - 'compatibility/bundle-refresh-r132.json'
      - 'compatibility/bundle-refresh-r133.json'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'docs/addon-bundle-r133.md'
      - 'scripts/refresh_release_addon.py'
      - 'scripts/test_refresh_release_addon.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-v4.1.73-supreme-armor-r133.yml'
      - 'compatibility/bundle-refresh-r132.json'
      - 'compatibility/bundle-refresh-r133.json'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'docs/addon-bundle-r133.md'
      - 'scripts/refresh_release_addon.py'
      - 'scripts/test_refresh_release_addon.py'

permissions:
  contents: read

concurrency:
  group: refresh-v4.1.73-addon-bundle
  cancel-in-progress: false

jobs:
  revision_scope:
    name: Check whether the archived r133 refresh still applies
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.read.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
      - name: Read the checked-out source manifest revision
        id: read
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path("compatibility/sfl-addon-release-matrix.json").read_text())
          print("revision=" + str(manifest["bundle_revision"]))
          PY

  prepare:
    name: Validate and stage r133 (45 addons)
    needs: revision_scope
    if: needs.revision_scope.outputs.revision == '133' && (github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'Publish addon bundle r133 with Supreme 1.0.20 fixes'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.refresh.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify archival safety regression tests
        run: PYTHONPATH=scripts python3 -m unittest scripts/test_refresh_release_addon.py scripts/test_verify_published_addon_bundle.py scripts/test_verify_addon_bytecode.py
      - name: Download exact release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/current work/new
          gh release download v4.1.73 --repo "$GITHUB_REPOSITORY" \
            --pattern SF_Addons_1.21.11-26.3.zip \
            --pattern Slimefun-Legacy4.1.73.jar --dir work/current
          gh release download v4.2.8 --repo wickidcow/SF_FNAmplifications \
            --pattern SF_FNAmplifications4.2.8.jar --dir work/new
          gh release download v1.0.20 --repo wickidcow/SF_Supreme \
            --pattern SF_Supreme1.0.20.jar --dir work/new
      - name: Verify input provenance and construct exact r132 intermediate lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          stage132 = json.loads(Path('compatibility/bundle-refresh-r132.json').read_text())
          stage133 = json.loads(Path('compatibility/bundle-refresh-r133.json').read_text())
          matrix = json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text())
          assert matrix['bundle_revision'] == 133
          assert stage132['bundle_revision'] == 132 and stage133['bundle_revision'] == 133
          assert stage133['old_bundle_sha256'] is None, 'r133 stage digest must be generated only from the checked r132 ZIP'
          assert stage132['old_bundle_sha256'] == stage133['published_old_bundle_sha256']
          assert len(matrix['addons']) == stage132['expected_addons'] == stage133['expected_addons'] == 45

          original = Path('work/current/SF_Addons_1.21.11-26.3.zip')
          assert hashlib.sha256(original.read_bytes()).hexdigest() == stage132['old_bundle_sha256'], 'Published ZIP changed'
          core = Path('work/current') / stage132['core_jar']
          assert hashlib.sha256(core.read_bytes()).hexdigest() == stage132['core_sha256'], 'Published Slimefun core changed'
          for config in (stage132, stage133):
              jar = Path('work/new') / config['new_jar']
              assert hashlib.sha256(jar.read_bytes()).hexdigest() == config['new_sha256'], 'Addon asset changed: ' + config['repository']
          with zipfile.ZipFile(original) as archive:
              manifest = json.loads(archive.read('SF_ADDON_MANIFEST.json'))
          assert manifest['bundle_revision'] == 131
          assert manifest['core_source_commit'] == stage132['core_source_commit'] == stage133['core_source_commit']
          existing = {a['repository']: a['commit'] for a in manifest['addons']}
          updated = {a['repository']: a['source_commit'] for a in matrix['addons']}
          assert len(existing) == len(updated) == 45
          changed = {k for k in existing if existing[k] != updated.get(k)}
          assert changed == {stage132['repository'], stage133['repository']}, 'Unexpected source pin changes: ' + str(changed)
          assert existing[stage132['repository']] == stage132['old_commit']
          assert existing[stage133['repository']] == stage133['old_commit']
          assert updated[stage132['repository']] == stage132['new_commit']
          assert updated[stage133['repository']] == stage133['new_commit']
          transitional = copy.deepcopy(matrix)
          transitional['bundle_revision'] = 132
          next(a for a in transitional['addons'] if a['repository'] == stage133['repository'])['source_commit'] = stage133['old_commit']
          Path('work/matrix-r132.json').write_text(json.dumps(transitional, indent=2) + '\n')
          print('Verified exact r131 published inputs and exactly two approved r133 pin changes.')
          PY
      - name: Create and verify staged revision 132 (previously approved FNAmplifications)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_release_addon.py \
            --config compatibility/bundle-refresh-r132.json \
            --matrix work/matrix-r132.json \
            --original work/current/SF_Addons_1.21.11-26.3.zip \
            --addon work/new/SF_FNAmplifications4.2.8.jar \
            --output work/stage-r132.zip > work/r132-validation.json
      - name: Create and independently validate final Supreme bundle revision 133
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          config = json.loads(Path('compatibility/bundle-refresh-r133.json').read_text())
          config['old_bundle_sha256'] = hashlib.sha256(Path('work/stage-r132.zip').read_bytes()).hexdigest()
          Path('work/stage-r133-config.json').write_text(json.dumps(config, indent=2) + '\n')
          PY
          python3 scripts/refresh_release_addon.py \
            --config work/stage-r133-config.json \
            --matrix compatibility/sfl-addon-release-matrix.json \
            --original work/stage-r132.zip \
            --addon work/new/SF_Supreme1.0.20.jar \
            --output work/SF_Addons_1.21.11-26.3.zip > work/r133-validation.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          previous = Path('work/current/SF_Addons_1.21.11-26.3.zip')
          final = Path('work/SF_Addons_1.21.11-26.3.zip')
          m = json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text())
          config = json.loads(Path('compatibility/bundle-refresh-r133.json').read_text())
          stage = json.loads(Path('compatibility/bundle-refresh-r132.json').read_text())
          with zipfile.ZipFile(previous) as before, zipfile.ZipFile(final) as after:
              old = json.loads(before.read('SF_ADDON_MANIFEST.json'))
              new = json.loads(after.read('SF_ADDON_MANIFEST.json'))
              assert new['bundle_revision'] == 133 and len(new['addons']) == 45
              assert new['core_source_commit'] == old['core_source_commit'] == config['core_source_commit']
              locked = {r['repository']: r['source_commit'] for r in m['addons']}
              observed = {r['repository']: r['commit'] for r in new['addons']}
              assert observed == locked, 'New ZIP sources are not exactly pinned in r133 matrix'
              differences = {r for r in locked if locked[r] != {x['repository']: x['commit'] for x in old['addons']}[r]}
              assert differences == {stage['repository'], config['repository']}
              old_jars = {n for n in before.namelist() if n.endswith('.jar')}
              new_jars = {n for n in after.namelist() if n.endswith('.jar')}
              assert len(old_jars) == len(new_jars) == 45
              expected_unchanged = old_jars - {stage['old_jar'], config['old_jar']}
              assert len(expected_unchanged) == 43
              assert all(before.read(n) == after.read(n) for n in expected_unchanged), 'Unrelated plugin JAR changed'
              for updated in (stage, config):
                  assert after.read(updated['new_jar']) == (Path('work/new') / updated['new_jar']).read_bytes()
                  assert hashlib.sha256(after.read(updated['new_jar'])).hexdigest() == updated['new_sha256']
              assert set(new_jars) == (old_jars - {stage['old_jar']}) | {stage['new_jar']}
              for name in set(before.namelist()) - old_jars - {'SF_ADDON_MANIFEST.json', 'SHA256SUMS.txt', 'COMPATIBILITY.txt'}:
                  assert before.read(name) == after.read(name), 'Unrelated non-addon member changed: ' + name
          report = json.loads(Path('work/r133-validation.json').read_text())
          assert report['addon_count'] == 45 and report['unchanged_addons'] == 44
          assert report['bundle_revision'] == 133
          digest = hashlib.sha256(final.read_bytes()).hexdigest()
          assert digest == report['bundle_sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + digest + '\n')
          print('Bundle r133 verified: 45 addons, 43 untouched, two pinned upgrades, SHA-256 ' + digest)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: addon-bundle-r133-candidate
          path: |
            work/SF_Addons_1.21.11-26.3.zip
            work/r132-validation.json
            work/r133-validation.json
          if-no-files-found: error

  publish:
    name: Publish unchanged-core v4.1.73 addon ZIP only
    needs: prepare
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish addon bundle r133 with Supreme 1.0.20 fixes')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: addon-bundle-r133-candidate
          path: work
      - name: Confirm release lease, upload and revalidate digest
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.prepare.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > work/latest.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.1.73" > work/release-before.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          config = json.loads(Path('compatibility/bundle-refresh-r133.json').read_text())
          current = json.loads(Path('work/release-before.json').read_text())
          latest = json.loads(Path('work/latest.json').read_text())
          assert latest['tag_name'] == config['release_tag'], 'Latest core release moved, rebase needed'
          assert current['target_commitish'] == config['core_source_commit'], 'Core release target moved'
          assets = {asset['name']: asset for asset in current['assets']}
          assert set(assets) == {config['core_jar'], config['resource_pack'], config['bundle_name']}
          assert assets[config['core_jar']]['digest'] == 'sha256:' + config['core_sha256'], 'Core JAR changed'
          assert assets[config['resource_pack']]['digest'] == 'sha256:' + config['resource_pack_sha256'], 'Resource pack changed'
          assert assets[config['bundle_name']]['digest'] == 'sha256:' + config['published_old_bundle_sha256'], 'Live bundle changed: refusing overwrite'
          final = Path('work') / config['bundle_name']
          assert hashlib.sha256(final.read_bytes()).hexdigest() == os.environ['CANDIDATE_DIGEST'], 'Candidate digest changed'
          validated = json.loads(Path('work/r133-validation.json').read_text())
          assert validated['bundle_revision'] == 133 and validated['addon_count'] == 45
          PY
          gh release upload v4.1.73 work/SF_Addons_1.21.11-26.3.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.1.73" > work/release-after.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('compatibility/bundle-refresh-r133.json').read_text())
          release = json.loads(Path('work/release-after.json').read_text())
          assets = {asset['name']: asset for asset in release['assets']}
          assert len(assets) == 3
          assert assets[config['bundle_name']]['digest'] == 'sha256:' + os.environ['CANDIDATE_DIGEST']
          assert assets[config['core_jar']]['digest'] == 'sha256:' + config['core_sha256']
          assert assets[config['resource_pack']]['digest'] == 'sha256:' + config['resource_pack_sha256']
          body = release.get('body') or ''
          body = body.replace('The addon ZIP is now at **revision 131**,\nincluding **Networks 1.0.52**.',
                              'The addon ZIP is now at **revision 133**, including **FNAmplifications 4.2.8** '
                              'and the **Supreme 1.0.20 Soulbound/armor effects rebuild**.')
          marker = '## Addon bundle refresh — revision 133'
          note = Path('docs/addon-bundle-r133.md').read_text()
          assert note.startswith(marker)
          if marker not in body:
              body = body.rstrip() + '\n\n' + note
          Path('work/release-notes.md').write_text(body)
          print('Published bundle r133, retained core/resource pack and all other 43 plugin JARs.')
          PY
          gh release edit v4.1.73 --repo "$GITHUB_REPOSITORY" \
            --notes-file work/release-notes.md
