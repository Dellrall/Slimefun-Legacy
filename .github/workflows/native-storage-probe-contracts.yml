name: Native Storage Probe Contracts

on:
  pull_request:
    paths:
      - '.github/workflows/native-storage-probe-contracts.yml'
      - 'scripts/runtime/r135_fluffy_networks/**'
      - 'scripts/test_native_storage_probe_contracts.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/native-storage-probe-contracts.yml'
      - 'scripts/runtime/r135_fluffy_networks/**'
      - 'scripts/test_native_storage_probe_contracts.py'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify revision, source, checksum and fixture gates without a server
        run: python3 -m unittest discover -s scripts -p 'test_native_storage_probe_contracts.py' -v
