name: Update v4.1.76 SlimeHUD 2.0.7 addon safely

on:
  pull_request:
    paths:
      - '.github/workflows/slimehud-v4176-addon-hotfix.yml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/slimehud-v4176-addon-hotfix.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish the verified SlimeHUD-only addon hotfix'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: v4176-slimehud-addon-asset-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    name: Verify and update only the published addon ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Require exact tested SlimeHUD source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/wickidcow/SF_SlimeHUD.git hud
          git -C hud checkout --detach 72ba3ca673beb2b48c15b5dc77bf1d1880f8a1e3
          test "$(git -C hud rev-parse HEAD)" = '72ba3ca673beb2b48c15b5dc77bf1d1880f8a1e3'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: hud/pom.xml

      - name: Rebuild exact SlimeHUD 2.0.7 and run its regression suite
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f hud/pom.xml clean package
          test -s hud/target/SF_SlimeHUD2.0.7.jar
          echo '0faa208bc991852e4e23ea839247141cf719363dc49dc3056bac8cee071e05a7  hud/target/SF_SlimeHUD2.0.7.jar' | sha256sum -c

      - name: Download untouched published v4.1.76 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq .tag_name)" = 'v4.1.76'
          mkdir -p downloaded
          gh release download v4.1.76 --repo wickidcow/Slimefun-Legacy --pattern 'SF_Addons_1.21.11-26.3.zip' --dir downloaded
          test -s downloaded/SF_Addons_1.21.11-26.3.zip
          echo '4543de9a9d7ff137ecb8a98e997f1a1b0e0ca4abc99929c1324eff7684b235bd  downloaded/SF_Addons_1.21.11-26.3.zip' | sha256sum -c

      - name: Replace only SlimeHUD, update manifest and verify all other bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, io, json, copy, re
          
          name = "SF_Addons_1.21.11-26.3.zip"
          src = Path("downloaded") / name
          dst = Path("dist") / name
          hud = Path("hud/target/SF_SlimeHUD2.0.7.jar")
          expected_bundle_sha = "4543de9a9d7ff137ecb8a98e997f1a1b0e0ca4abc99929c1324eff7684b235bd"
          expected_hud_sha = "0faa208bc991852e4e23ea839247141cf719363dc49dc3056bac8cee071e05a7"
          source_pin = "72ba3ca673beb2b48c15b5dc77bf1d1880f8a1e3"
          def sha(b): return hashlib.sha256(b).hexdigest()
          def check(condition, message):
              if not condition: raise RuntimeError(message)
          def unpack(z):
              names = z.namelist()
              check(len(names) == len(set(names)), "Duplicate ZIP entry")
              check(all(n and not n.startswith("/") and ".." not in n.split("/") and "\\" not in n for n in names),
                    "Unsafe entry name")
              return {n: z.read(n) for n in names}
          
          original = src.read_bytes()
          check(sha(original) == expected_bundle_sha, "Published archive has changed: refuse overwrite")
          new_hud = hud.read_bytes()
          check(sha(new_hud) == expected_hud_sha, "Source-built SlimeHUD does not match runtime-tested JAR")
          with ZipFile(io.BytesIO(new_hud)) as z:
              plugin = unpack(z)
          check("plugin.yml" in plugin, "Missing SlimeHUD plugin descriptor")
          descriptor = plugin["plugin.yml"].decode()
          check(re.search(r"(?m)^version:\s*2\.0\.6\s*$", descriptor) is not None, "Wrong SlimeHUD version")
          check("WITIntegration" not in "\n".join(plugin), "WIT integration not removed")
          check(not re.search(r"(?m)^\s*-\s*WIT\s*$", descriptor), "WIT is still a soft dependency")
          config = plugin["config.yml"].decode()
          check(re.search(r"(?m)^\s*default-enabled:\s*false\s*$", config) is not None, "HUD must default OFF")
          check(re.search(r"(?m)^\s*crouch-only:\s*true\s*$", config) is not None, "Crouch-only should be ON by default")
          check(re.search(r"(?m)^\s*disabled:\s*false\s*$", config) is not None, "Global disable blocks opting in")
          
          with ZipFile(io.BytesIO(original)) as z:
              previous = unpack(z)
              infos = {item.filename: copy.copy(item) for item in z.infolist()}
              check("SF_ADDON_MANIFEST.json" in previous and "SHA256SUMS.txt" in previous,
                    "Release manifest or checksums missing")
              manifest = json.loads(previous["SF_ADDON_MANIFEST.json"])
              check(manifest.get("bundle") == name, "Unexpected bundle identifier")
              check(manifest.get("bundle_revision") == 147, "Expected current release bundle revision 147")
              check(manifest.get("core_source_commit") == "9075ea852095b28543aaa1456bc2576778cb4c4d",
                    "Unexpected core release commit")
              rows = manifest["addons"]
              check(len(rows) == 45 and len({r["slug"] for r in rows}) == 45, "Expected 45 maintained addons")
              old_names = {r["jar"] for r in rows}
              actual_names = {n for n in previous if n.endswith(".jar")}
              check(old_names == actual_names, "Published addon files differ from the verified revision 147 manifest")
              old_sums = sorted(previous["SHA256SUMS.txt"].decode().strip().splitlines())
              expected_sums = sorted(f'{sha(previous[row["jar"]])}  {row["jar"]}' for row in rows)
              check(old_sums == expected_sums, "Published checksums do not match revision 147")
              for row in rows:
                  check(sha(previous[row["jar"]]) == row["sha256"],
                        "Published addon metadata digest mismatch: " + row["jar"])
              magic = next((r for r in rows if r["slug"] == "magicexpansion"), None)
              check(magic is not None and magic["jar"] == "SF_MagicExpansion1.1.17.jar",
                    "MagicExpansion 1.1.17 must be retained")
              magic_sha = sha(previous[magic["jar"]])
              matches = [r for r in rows if r["slug"] == "slimehud"]
              check(len(matches) == 1 and matches[0]["repository"] == "wickidcow/SF_SlimeHUD",
                    "Unexpected SlimeHUD record")
              old_row = matches[0]
              old_hud = old_row["jar"]
              check(old_hud == "SF_SlimeHUD2.0.6.jar" and "SF_SlimeHUD2.0.7.jar" not in previous,
                    "Published SlimeHUD must still be 2.0.6")
              new_row = copy.deepcopy(old_row)
              new_row.update({"jar": "SF_SlimeHUD2.0.7.jar",
                              "source_jar": "SF_SlimeHUD2.0.7.jar",
                              "version": "2.0.7", "commit": source_pin, "sha256": expected_hud_sha})
              fresh_manifest = copy.deepcopy(manifest)
              fresh_manifest["bundle_revision"] = 148
              fresh_manifest["addons"] = [
                  new_row if row["slug"] == "slimehud" else row for row in rows
              ]
              fresh = dict(previous)
              del fresh[old_hud]
              fresh[new_row["jar"]] = new_hud
              fresh["SF_ADDON_MANIFEST.json"] = (json.dumps(fresh_manifest, indent=2, ensure_ascii=False) + "\n").encode()
              fresh["SHA256SUMS.txt"] = ("\n".join(sorted(
                  f'{sha(fresh[row["jar"]])}  {row["jar"]}' for row in fresh_manifest["addons"])) + "\n").encode()
              check({n for n in fresh if n.endswith(".jar")} == {r["jar"] for r in fresh_manifest["addons"]},
                    "Addon output set mismatch")
              check(all(fresh[k] == previous[k] for k in previous if k not in
                        (old_hud, "SF_ADDON_MANIFEST.json", "SHA256SUMS.txt")),
                    "An unrelated file would change")
              check(sha(fresh[magic["jar"]]) == magic_sha, "MagicExpansion changed")
              dst.parent.mkdir(parents=True, exist_ok=True)
              with ZipFile(dst, "w", allowZip64=True) as out:
                  for n in z.namelist():
                      if n == old_hud:
                          info = infos[n]
                          info.filename = new_row["jar"]
                          out.writestr(info, new_hud)
                      else:
                          out.writestr(infos[n], fresh[n])
          with ZipFile(dst) as checkzip:
              result = unpack(checkzip)
              check(checkzip.testzip() is None, "Result CRC invalid")
          check(result == fresh, "ZIP roundtrip changed data")
          receipt = {
              "release": "v4.1.76",
              "new_bundle_sha256": sha(dst.read_bytes()),
              "old_bundle_sha256": sha(original),
              "new_slimehud_sha256": sha(new_hud),
              "slimehud_source": source_pin,
              "magicexpansion_sha256_preserved": magic_sha,
              "other_addons_preserved": 44,
              "bundle_revision": 148,
              "addon_count": 45
          }
          Path("dist/verify.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
          test -s dist/SF_Addons_1.21.11-26.3.zip
          python3 -m zipfile -t dist/SF_Addons_1.21.11-26.3.zip

      - name: Record exact-input and preservation evidence
        uses: actions/upload-artifact@v7
        with:
          name: slimehud-v4176-preservation-report
          path: dist/verify.json
          if-no-files-found: error

      - name: Keep a verified live-release ZIP preview for review
        uses: actions/upload-artifact@v7
        with:
          name: SF_Addons_v4.1.76_SlimeHUD_2.0.7_preview
          path: dist/SF_Addons_1.21.11-26.3.zip
          archive: false
          if-no-files-found: error

      - name: Publish only after all source, run, and release guards
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO=wickidcow/Slimefun-Legacy
          NAME=SF_Addons_1.21.11-26.3.zip
          TAG=v4.1.76
          NEW_SHA="$(sha256sum "dist/$NAME" | awk '{print $1}')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
          python3 - <<'PY'
          import json
          source=json.load(open('compatibility/sfl-addon-release-matrix.json'))
          rows=[r for r in source['addons'] if r['slug']=='slimehud']
          assert source['bundle_revision']==148 and len(rows)==1
          assert rows[0]['source_commit']=='72ba3ca673beb2b48c15b5dc77bf1d1880f8a1e3'
          PY
          test "$(gh api "repos/$REPO/actions/runs/39857943769" --jq '.head_sha')" = '1a5b28ec04441339b41f227b2d607ca66bc563c2'
          test "$(gh api "repos/$REPO/actions/runs/39857943769" --jq '.conclusion')" = success
          original_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .id')"
          original_digest="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .digest')"
          test -n "$original_id"
          test "$original_digest" = 'sha256:4543de9a9d7ff137ecb8a98e997f1a1b0e0ca4abc99929c1324eff7684b235bd'
          BACKUP=SF_Addons_1.21.11-26.3.before-SlimeHUD-2.0.7.zip
          test -z "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.before-SlimeHUD-2.0.7.zip") | .id')"
          gh api --method PATCH "repos/$REPO/releases/assets/$original_id" -f name="$BACKUP" >/dev/null
          rollback() {
            echo 'Release update failed; restoring the previous addon ZIP.' >&2
            new_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .id' || true)"
            if [[ -n "$new_id" ]]; then gh api --method DELETE "repos/$REPO/releases/assets/$new_id" >/dev/null || true; fi
            gh api --method PATCH "repos/$REPO/releases/assets/$original_id" -f name="$NAME" >/dev/null || true
          }
          trap rollback ERR
          gh release upload "$TAG" "dist/$NAME" --repo "$REPO"
          new_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .id')"
          new_digest="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "SF_Addons_1.21.11-26.3.zip") | .digest')"
          test -n "$new_id"
          test "$new_digest" = "sha256:$NEW_SHA"
          mkdir -p verified-upload
          gh release download "$TAG" --repo "$REPO" --pattern "$NAME" --dir verified-upload
          echo "$NEW_SHA  verified-upload/$NAME" | sha256sum -c
          gh api --method DELETE "repos/$REPO/releases/assets/$original_id" >/dev/null
          trap - ERR
          echo "Updated $TAG $NAME; SHA-256: $NEW_SHA" >> "$GITHUB_STEP_SUMMARY"
